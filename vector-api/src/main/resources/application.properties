server.port=8082
server.tomcat.max-http-form-post-size=1MB
spring.mvc.async.request-timeout=-1
spring.servlet.multipart.max-request-size=1MB

spring.datasource.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/launchpad}
spring.datasource.username=${VECTOR_DB_USER:launchpad}
spring.datasource.password=${VECTOR_DB_PASS:launchpad}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

deploy.hook.secret=${VECTOR_DEPLOY_HOOK_SECRET}

docker.socket=${VECTOR_DOCKER_SOCKET:unix:///var/run/docker.sock}
dockerhub.username=${VECTOR_DOCKERHUB_USER:}
dockerhub.token=${VECTOR_DOCKERHUB_TOKEN:}
app.default-port=3000
traefik.network=traefik

# Domain derivation (DomainConfig). VECTOR_DOMAIN is the single human-set base;
# everything public is derived: deploy.<domain>, api.deploy.<domain>,
# <app>.<namespace>.<domain>. VECTOR_DOMAIN_WEB/API are per-host escape hatches.
vector.domain=${VECTOR_DOMAIN:localhost}
vector.domain.web=${VECTOR_DOMAIN_WEB:}
vector.domain.api=${VECTOR_DOMAIN_API:}
vector.app-namespace=${VECTOR_APP_NAMESPACE:apps}

encryption.key=${VECTOR_ENCRYPTION_KEY}

resend.api-key=${VECTOR_RESEND_API_KEY:}
resend.from=Vector <onboarding@resend.dev>
resend.to=${VECTOR_RESEND_TO:}

app.api-key=${VECTOR_API_KEY:}

github.token=${VECTOR_GITHUB_TOKEN:}

github.app.id=${VECTOR_GITHUB_APP_ID:}
github.app.private-key=${VECTOR_GITHUB_APP_PRIVATE_KEY:}
github.app.webhook-secret=${VECTOR_GITHUB_APP_WEBHOOK_SECRET:}

# Tunables below have no env placeholders by design: override any of them via
# Spring relaxed binding (e.g. vector.ai.gemini.model -> VECTOR_AI_GEMINI_MODEL,
# app.default-port -> APP_DEFAULTPORT) — see README "Environment variables".
vector.ai.provider=gemini
vector.ai.gemini.api-key=${VECTOR_GEMINI_API_KEY:}
vector.ai.gemini.model=gemini-2.5-flash
vector.ai.gemini.timeout-seconds=30

# Ollama fallback — set vector.ai.provider=ollama to use
vector.ai.base-url=http://localhost:11434
vector.ai.model=llama3.2:3b
vector.ai.request-timeout-seconds=120

vector.ai.log-tail-lines=200

# Comma-separated list of reverse-proxy IPs whose X-Forwarded-For header is
# trusted. Leave blank (default) in local dev or with no proxy in front.
vector.security.trusted-proxies=${VECTOR_TRUSTED_PROXIES:}

# Shared token sent on the X-Updater-Auth header for every outbound call to
# vector-updater. Auto-generated by ./vector on the Docker path.
updater.auth.token=${VECTOR_UPDATER_AUTH_TOKEN:}
updater.base-url=${VECTOR_UPDATER_BASE_URL:http://vector-updater:8080}
