name: vector-platform

# HTTPS overlay for VPS deployment (legacy Docker path). Use alongside the base compose:
#   ./vector -f docker-compose.yml -f docker-compose.https.yml up -d
#
# Required env vars (in .env):
#   VECTOR_DOMAIN       Base domain; hosts derive as deploy.<domain> / api.deploy.<domain>.
#   VECTOR_ACME_EMAIL   Contact email Let's Encrypt sends expiry notices to.
# Optional overrides: VECTOR_DOMAIN_WEB / VECTOR_DOMAIN_API replace the derived hosts.
#
# The base file's HTTP entrypoint is preserved so deploy-hook traffic from
# GitHub Actions continues to work. All HTML/dashboard traffic is redirected
# from HTTP to HTTPS at the Traefik layer.

services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${VECTOR_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${VECTOR_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt

  vector-api:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vector-api.rule=Host(`${VECTOR_DOMAIN_API:-api.deploy.${VECTOR_DOMAIN}}`)"
      - "traefik.http.routers.vector-api.entrypoints=websecure"
      - "traefik.http.routers.vector-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vector-api-deploy-hook.rule=Host(`${VECTOR_DOMAIN_API:-api.deploy.${VECTOR_DOMAIN}}`) && PathPrefix(`/deploy-hook`)"
      - "traefik.http.routers.vector-api-deploy-hook.entrypoints=websecure"
      - "traefik.http.routers.vector-api-deploy-hook.tls.certresolver=letsencrypt"
      - "traefik.http.services.vector-api.loadbalancer.server.port=8082"
      - "traefik.http.services.vector-api.loadbalancer.responseforwarding.flushinterval=100ms"

  vector-web:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vector-web.rule=Host(`${VECTOR_DOMAIN_WEB:-deploy.${VECTOR_DOMAIN}}`)"
      - "traefik.http.routers.vector-web.entrypoints=websecure"
      - "traefik.http.routers.vector-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.vector-web.loadbalancer.server.port=3000"

volumes:
  traefik_acme:
    name: vector_traefik_acme
