server.port=8082

spring.datasource.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/launchpad}
spring.datasource.username=${VECTOR_DB_USER:vector_analyzer}
spring.datasource.password=${VECTOR_DB_PASS:vector_analyzer}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=analyzer

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/analyzer
spring.flyway.schemas=analyzer
spring.flyway.default-schema=analyzer

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

app.api-key=${VECTOR_API_KEY:}

github.token=${VECTOR_GITHUB_TOKEN:}

vector.api.internal-url=${VECTOR_API_INTERNAL_URL:http://vector-api:8082}

vector.log.retention-days=${VECTOR_LOG_RETENTION_DAYS:30}
vector.log.retention-deploys=${VECTOR_LOG_RETENTION_DEPLOYS:5}
