server.port=8082

spring.datasource.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/launchpad}
spring.datasource.username=${VECTOR_DB_USER:vector_analyzer}
spring.datasource.password=${VECTOR_DB_PASS:vector_analyzer}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=analyzer

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/analyzer
spring.flyway.schemas=analyzer
spring.flyway.default-schema=analyzer

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

app.api-key=${VECTOR_API_KEY:}

github.token=${VECTOR_GITHUB_TOKEN:}

vector.api.internal-url=${VECTOR_API_INTERNAL_URL:http://vector-api:8082}

# Tunables below have no env placeholders by design: override via Spring relaxed
# binding (e.g. vector.log.retention-days -> VECTOR_LOG_RETENTIONDAYS,
# analyzer.ai.max-regenerations -> ANALYZER_AI_MAXREGENERATIONS).
vector.log.retention-days=30
vector.log.retention-deploys=5

# AI provider — defaults match vector-api so VECTOR_GEMINI_API_KEY works for both.
vector.ai.provider=gemini
vector.ai.gemini.api-key=${VECTOR_GEMINI_API_KEY:}
vector.ai.gemini.model=gemini-2.5-flash
vector.ai.gemini.timeout-seconds=30

# How many user-triggered regenerations are allowed per crash (initial generation not counted).
analyzer.ai.max-regenerations=1
