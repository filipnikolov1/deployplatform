services:
  traefik:
    image: traefik:v3.3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - traefik

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_USERNAME:-launchpad}
      POSTGRES_USER: ${DB_USERNAME:-launchpad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-launchpad}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-launchpad}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - traefik

  launchpad:
    image: filipn123/launchpad-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/launchpad
      DOCKER_SOCKET: unix:///var/run/docker.sock
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_started
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.launchpad.rule=Host(`launchpad.localhost`)"
      - "traefik.http.routers.launchpad.entrypoints=web"
      - "traefik.http.routers.launchpad-deploy-hook.rule=PathPrefix(`/deploy-hook`)"
      - "traefik.http.routers.launchpad-deploy-hook.entrypoints=web"
      - "traefik.http.services.launchpad.loadbalancer.server.port=8082"

  launchpad-frontend:
    image: filipn123/launchpad-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://launchpad:8082
      API_KEY: ${APP_API_KEY}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      - launchpad
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`appdashboard.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.services.dashboard.loadbalancer.server.port=3000"

  watchtower:
    image: containrrr/watchtower
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
    command: launchpad-launchpad-1

networks:
  traefik:
    name: traefik

volumes:
  postgres_data:
  ollama_data:
