services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - ${VECTOR_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - traefik

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${VECTOR_DB_USER:-launchpad}
      POSTGRES_USER: ${VECTOR_DB_USER:-launchpad}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASS:-launchpad}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_DB_USER:-launchpad}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ollama:                         # Optional — uncomment to run local LLM fallback
  #   image: ollama/ollama          # Requires vector.ai.provider=ollama in application.properties
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   networks:
  #     - traefik

  vector-api:
    image: ${VECTOR_BACKEND_IMAGE:-filipn123/vector-api:latest}
    container_name: vector-api
    build:
      context: .
      dockerfile: vector-api/Dockerfile
    env_file:
      - .env
    environment:
      VECTOR_DB_URL: jdbc:postgresql://postgres:5432/launchpad
      VECTOR_DOCKER_SOCKET: unix:///var/run/docker.sock
      UPDATER_BASE_URL: http://vector-updater:8080
    volumes:
      - ${VECTOR_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_started
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vector-api.rule=Host(`vector-api.localhost`)"
      - "traefik.http.routers.vector-api.entrypoints=web"
      - "traefik.http.routers.vector-api-deploy-hook.rule=PathPrefix(`/deploy-hook`)"
      - "traefik.http.routers.vector-api-deploy-hook.entrypoints=web"
      - "traefik.http.services.vector-api.loadbalancer.server.port=8082"
      - "traefik.http.services.vector-api.loadbalancer.responseforwarding.flushinterval=100ms"

  vector-web:
    image: ${VECTOR_FRONTEND_IMAGE:-filipn123/vector-web:latest}
    container_name: vector-web
    build:
      context: ./vector-web
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://vector-api:8082
      API_KEY: ${VECTOR_API_KEY}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      SESSION_SECRET: ${VECTOR_SESSION_SECRET}
    depends_on:
      - vector-api
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vector-web.rule=Host(`vector.localhost`)"
      - "traefik.http.routers.vector-web.entrypoints=web"
      - "traefik.http.services.vector-web.loadbalancer.server.port=3000"

  vector-updater:
    image: filipn123/vector-updater:latest
    build:
      context: ./vector-updater
      dockerfile: Dockerfile
    environment:
      COMPOSE_PROJECT_NAME: vector-platform
    volumes:
      - ${VECTOR_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./.env:/workspace/.env:ro
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    name: traefik

volumes:
  postgres_data:
  # ollama_data:    # Uncomment if ollama service is re-enabled
