name: vector-platform

services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - ${VECTOR_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - traefik

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: launchpad
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: ${VECTOR_DB_PASS:?missing — run ./vector up to generate}
      # Consumed by postgres/init/02-vector-analyzer-user.sh on fresh volumes.
      VECTOR_ANALYZER_DB_PASS: ${VECTOR_ANALYZER_DB_PASS:?missing — run ./vector up to generate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ollama:                         # Optional — uncomment to run local LLM fallback
  #   image: ollama/ollama          # Requires vector.ai.provider=ollama in application.properties
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   networks:
  #     - traefik

  vector-api:
    image: ${VECTOR_BACKEND_IMAGE:-filipn123/vector-api:latest}
    container_name: vector-api
    build:
      context: .
      dockerfile: vector-api/Dockerfile
    env_file:
      - .env
    environment:
      VECTOR_DB_URL: jdbc:postgresql://postgres:5432/launchpad
      VECTOR_DB_USER: launchpad
      VECTOR_DOCKER_SOCKET: unix:///var/run/docker.sock
      VECTOR_UPDATER_BASE_URL: http://vector-updater:8080
      VECTOR_UPDATER_AUTH_TOKEN: ${VECTOR_UPDATER_AUTH_TOKEN:-}
      VECTOR_SELF_HOSTED: "true"
    volumes:
      - ${VECTOR_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_started
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vector-api.rule=Host(`api.deploy.${VECTOR_DOMAIN:-localhost}`)"
      - "traefik.http.routers.vector-api.entrypoints=web"
      - "traefik.http.routers.vector-api-deploy-hook.rule=PathPrefix(`/deploy-hook`)"
      - "traefik.http.routers.vector-api-deploy-hook.entrypoints=web"
      - "traefik.http.services.vector-api.loadbalancer.server.port=8082"
      - "traefik.http.services.vector-api.loadbalancer.responseforwarding.flushinterval=100ms"

  vector-web:
    image: ${VECTOR_FRONTEND_IMAGE:-filipn123/vector-web:latest}
    container_name: vector-web
    build:
      context: ./vector-web
      dockerfile: Dockerfile
    environment:
      VECTOR_BACKEND_URL: http://vector-api:8082
      VECTOR_ANALYZER_URL: http://vector-analyzer:8082
      VECTOR_API_KEY: ${VECTOR_API_KEY}
      VECTOR_DASHBOARD_PASSWORD: ${VECTOR_DASHBOARD_PASSWORD}
      VECTOR_SESSION_SECRET: ${VECTOR_SESSION_SECRET}
      VECTOR_DOMAIN: ${VECTOR_DOMAIN:-localhost}
      # `-` (not `:-`): an explicitly blank namespace means apps on the root domain.
      VECTOR_APP_NAMESPACE: ${VECTOR_APP_NAMESPACE-apps}
    depends_on:
      - vector-api
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vector-web.rule=Host(`deploy.${VECTOR_DOMAIN:-localhost}`)"
      - "traefik.http.routers.vector-web.entrypoints=web"
      - "traefik.http.services.vector-web.loadbalancer.server.port=3000"

  vector-analyzer:
    image: ${VECTOR_ANALYZER_IMAGE:-filipn123/vector-analyzer:latest}
    container_name: vector-analyzer
    build:
      context: .
      dockerfile: vector-analyzer/Dockerfile
    env_file:
      - .env
    environment:
      VECTOR_DB_URL: jdbc:postgresql://postgres:5432/launchpad
      VECTOR_DB_USER: vector_analyzer
      VECTOR_DB_PASS: ${VECTOR_ANALYZER_DB_PASS:?missing — run ./vector up to generate}
      VECTOR_API_INTERNAL_URL: http://vector-api:8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      - "traefik.enable=false"

  vector-updater:
    image: filipn123/vector-updater:latest
    container_name: vector-updater
    build:
      context: ./vector-updater
      dockerfile: Dockerfile
    environment:
      VECTOR_COMPOSE_PROJECT_NAME: vector-platform
      VECTOR_UPDATER_AUTH_TOKEN: ${VECTOR_UPDATER_AUTH_TOKEN:-}
    volumes:
      - ${VECTOR_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Mount the project dir, not individual files — editor-driven inode replacement
      # of .env or docker-compose.yml breaks file-level binds.
      - ./:/workspace:ro
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    name: traefik
    external: true

volumes:
  postgres_data:
    # Legacy volume name pinned across the project rename so existing data is preserved.
    name: launchpad_postgres_data
  # ollama_data:    # Uncomment if ollama service is re-enabled
