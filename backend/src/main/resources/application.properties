server.port=8082
server.tomcat.max-http-form-post-size=1MB
spring.servlet.multipart.max-request-size=1MB

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/launchpad}
spring.datasource.username=${DB_USERNAME:launchpad}
spring.datasource.password=${DB_PASSWORD:launchpad}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

deploy.hook.secret=${DEPLOY_HOOK_SECRET}

docker.socket=${DOCKER_SOCKET:unix:///var/run/docker.sock}
dockerhub.username=${DOCKERHUB_USERNAME:}
dockerhub.token=${DOCKERHUB_TOKEN:}
app.default-port=${APP_DEFAULT_PORT:3000}
traefik.network=traefik
traefik.domain=localhost

encryption.key=${ENCRYPTION_KEY}

resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Launchpad <onboarding@resend.dev>}
resend.to=${RESEND_TO:}

app.api-key=${APP_API_KEY:}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8082}

github.token=${GITHUB_TOKEN:}

launchpad.ai.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
launchpad.ai.model=${OLLAMA_MODEL:llama3.2:3b}
launchpad.ai.log-tail-lines=200
launchpad.ai.request-timeout-seconds=120